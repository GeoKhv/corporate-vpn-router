[package]
name = "cvr-ipsec"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
snxcore = { path = "../../crates/snxcore", features = ["vendored-openssl", "vendored-sqlite"] }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
openssl-src = { version = "300", features = ["no-dso"] }

[lints]
workspace = true
